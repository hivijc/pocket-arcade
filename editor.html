<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Backyard — hole editor</title>
    <style>
      body { margin: 16px; background: #14141c; color: #efe6d2; font: 12px ui-monospace, monospace; }
      main { display: flex; gap: 16px; align-items: flex-start; }
      canvas { width: 720px; height: 540px; image-rendering: pixelated; display: block; cursor: crosshair; }
      aside { width: 360px; display: flex; flex-direction: column; gap: 10px; }
      fieldset { border: 1px solid #3a3a4a; margin: 0; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
      legend { color: #d9c08c; }
      label { display: inline-flex; gap: 4px; align-items: center; }
      input[type=number] { width: 52px; }
      input, select, button, textarea { font: inherit; background: #22222c; color: inherit; border: 1px solid #4a4a5a; }
      button { padding: 3px 8px; cursor: pointer; }
      textarea { width: 100%; height: 220px; box-sizing: border-box; }
      #errors { color: #ff9a8a; white-space: pre-wrap; min-height: 1em; }
      #errors.ok { color: #9fd89a; }
      #solve-result { white-space: pre-wrap; }
      .hint { color: #8a8a9a; }
    </style>
  </head>
  <body>
    <main>
      <div>
        <canvas id="view" width="360" height="270"></canvas>
        <p class="hint">Click or drag to apply the tool. Height tools act on the nearest corner; Shift-click lowers with the raise tool.</p>
      </div>
      <aside>
        <fieldset>
          <legend>Hole</legend>
          <select id="file"></select>
          <label>name <input id="name" size="16" /></label>
          <label>par <input id="par" type="number" min="1" max="5" /></label>
          <label>w <input id="width" type="number" min="1" max="21" /></label>
          <label>d <input id="depth" type="number" min="1" max="21" /></label>
          <button id="resize">Resize</button>
        </fieldset>
        <fieldset id="tools">
          <legend>Tool</legend>
        </fieldset>
        <fieldset>
          <legend>Preview</legend>
          <select id="phase"></select>
          <button id="solve">Solve par</button>
        </fieldset>
        <div id="errors"></div>
        <div id="solve-result"></div>
        <fieldset>
          <legend>JSON</legend>
          <textarea id="json" spellcheck="false"></textarea>
          <button id="load">Load text</button>
          <button id="copy">Copy</button>
          <button id="download">Download</button>
        </fieldset>
      </aside>
    </main>
    <script type="module" src="/src/editor.ts"></script>
  </body>
</html>
